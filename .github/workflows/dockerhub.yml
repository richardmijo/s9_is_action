name: Subir imange a docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Construir y subir imagen
    runs-on: ubuntu-latest
  
  steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Iniciar sesion en dockerhub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKEHUB_USERNAME}}
        password: ${{secrets.DOCKEHUB_TOKEN}}

    - name: Construir y subir imange
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{secrets.DOCKEHUB_USERNAME}}/mi-primer-imagen:latest